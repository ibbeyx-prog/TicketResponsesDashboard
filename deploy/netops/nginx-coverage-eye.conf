# Install on NetOps host (adjust upstream IPs if not localhost).
# Include from nginx server block for netops.dhiraagu.com.mv:
#
#   include /etc/nginx/snippets/coverage-eye.conf;

# Streamlit dashboard (public path)
location /coverage-eye/ {
    proxy_pass http://127.0.0.1:8501/coverage-eye/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400;
}

# Telegram bot webhook — MUST NOT live under /coverage-eye/
location = /webhook {
    proxy_pass http://127.0.0.1:8000/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 25m;
}

location = /health {
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
